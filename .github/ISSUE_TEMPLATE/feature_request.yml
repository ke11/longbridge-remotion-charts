name: Feature request
description: Suggest a new chart, setting or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the feature, and the video you're trying to make with it.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example or mock-up
      description: Optional. A sketch, screenshot or link to a similar video helps a lot.
